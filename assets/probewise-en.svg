<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 408" width="1000" height="408" role="img" aria-label="Probewise">
<style>
  .k{font:600 13px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;letter-spacing:2px}
  .st{font:600 12px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;letter-spacing:1px}
  .t{font:700 36px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .sub{font:600 22px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#22d3ee}
  .desc{font:400 17px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .fa{font:700 15px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .fb{font:400 12.5px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .big{font:700 42px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif}
  .ml1{font:600 16px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .ml2{font:400 14px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .chip{font:500 13px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
  .foot{font:400 13.5px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#6b7a8f}
  .flow{stroke-dasharray:4 4;animation:f 1s linear infinite}@keyframes f{to{stroke-dashoffset:-8}}
  .dot{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.25}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".13"/><stop offset=".6" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs><rect width="1000" height="408" rx="16" fill="#111827"/><rect width="1000" height="408" rx="16" fill="url(#g)"/><rect x=".5" y=".5" width="999" height="407" rx="16" fill="none" stroke="#243042"/><rect x="0" y="24" width="5" height="60" rx="2.5" fill="#22d3ee"/><text x="40" y="44" class="k" fill="#22d3ee" data-maxw="700">FLAGSHIP · OPEN SOURCE · LIVE DEMO</text><circle cx="964" cy="39" r="5" fill="#34d399" class="dot"/><text x="950" y="44" class="st" fill="#34d399" text-anchor="end" data-maxw="160">LIVE DEMO</text><text x="40" y="90" class="t" data-maxw="220">Probewise</text><text x="231" y="88" class="sub" data-maxw="383">WAF / IDS alert-triage agent</text><text x="40" y="122" class="desc" data-maxw="920">A controller decides what to probe and when to stop; nothing closes without verified evidence</text><rect x="40" y="146" width="164" height="64" rx="10" fill="#0b0f17" stroke="#22d3ee" stroke-opacity=".55"/><text x="122" y="173" class="fa" text-anchor="middle" data-maxw="152">Alert in</text><text x="122" y="195" class="fb" text-anchor="middle" data-maxw="152">WAF / IDS</text><path d="M208 178.0h15" stroke="#22d3ee" stroke-width="1.6" class="flow"/><path d="M221 174.0l5 4l-5 4" fill="none" stroke="#22d3ee" stroke-width="1.6"/><rect x="229" y="146" width="164" height="64" rx="10" fill="#0b0f17" stroke="#22d3ee" stroke-opacity=".55"/><text x="311" y="173" class="fa" text-anchor="middle" data-maxw="152">LangGraph controller</text><text x="311" y="195" class="fb" text-anchor="middle" data-maxw="152">checkpoint time-travel</text><path d="M397 178.0h15" stroke="#22d3ee" stroke-width="1.6" class="flow"/><path d="M410 174.0l5 4l-5 4" fill="none" stroke="#22d3ee" stroke-width="1.6"/><rect x="418" y="146" width="164" height="64" rx="10" fill="#0b0f17" stroke="#22d3ee" stroke-opacity=".55"/><text x="500" y="173" class="fa" text-anchor="middle" data-maxw="152">Read-only agents</text><text x="500" y="195" class="fb" text-anchor="middle" data-maxw="152">runbook code + opt. LLM</text><path d="M586 178.0h15" stroke="#22d3ee" stroke-width="1.6" class="flow"/><path d="M599 174.0l5 4l-5 4" fill="none" stroke="#22d3ee" stroke-width="1.6"/><rect x="607" y="146" width="164" height="64" rx="10" fill="#0b0f17" stroke="#22d3ee" stroke-opacity=".55"/><text x="689" y="173" class="fa" text-anchor="middle" data-maxw="152">Verify evidence</text><text x="689" y="195" class="fb" text-anchor="middle" data-maxw="152">verbatim, field + offset</text><path d="M775 178.0h15" stroke="#22d3ee" stroke-width="1.6" class="flow"/><path d="M788 174.0l5 4l-5 4" fill="none" stroke="#22d3ee" stroke-width="1.6"/><rect x="796" y="146" width="164" height="64" rx="10" fill="#0b0f17" stroke="#34d399" stroke-opacity=".55"/><text x="878" y="173" class="fa" text-anchor="middle" data-maxw="152">Close / approve</text><text x="878" y="195" class="fb" text-anchor="middle" data-maxw="152">interrupt() on high risk</text><text x="40" y="286" class="big" fill="#22d3ee" data-maxw="124">37%</text><text x="170" y="270" class="ml1" data-maxw="157">alerts auto-closed</text><text x="170" y="294" class="ml2" data-maxw="157">at 99.1% precision</text><line x1="331" y1="246" x2="331" y2="302" stroke="#243042"/><text x="347" y="286" class="big" fill="#22d3ee" data-maxw="124">3/500</text><text x="477" y="270" class="ml1" data-maxw="157">attacks missed</text><text x="477" y="294" class="ml2" data-maxw="157">0.6% miss rate</text><line x1="637" y1="246" x2="637" y2="302" stroke="#243042"/><text x="653" y="286" class="big" fill="#22d3ee" data-maxw="124">0/500</text><text x="783" y="270" class="ml1" data-maxw="157">attacks flipped</text><text x="783" y="294" class="ml2" data-maxw="157">by log-field injection</text><rect x="40" y="330" width="95" height="26" rx="13" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="87" y="348" class="chip" fill="#22d3ee" text-anchor="middle" data-maxw="87">LangGraph</text><rect x="143" y="330" width="103" height="26" rx="13" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="194" y="348" class="chip" fill="#22d3ee" text-anchor="middle" data-maxw="95">MCP Server</text><rect x="253" y="330" width="111" height="26" rx="13" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="308" y="348" class="chip" fill="#22d3ee" text-anchor="middle" data-maxw="103">Agent Skill</text><rect x="372" y="330" width="86" height="26" rx="13" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="415" y="348" class="chip" fill="#22d3ee" text-anchor="middle" data-maxw="78">BM25 RAG</text><rect x="466" y="330" width="127" height="26" rx="13" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="530" y="348" class="chip" fill="#22d3ee" text-anchor="middle" data-maxw="119">OpenTelemetry</text><rect x="601" y="330" width="159" height="26" rx="13" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="681" y="348" class="chip" fill="#22d3ee" text-anchor="middle" data-maxw="151">Platt calibration</text><rect x="768" y="330" width="159" height="26" rx="13" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/><text x="848" y="348" class="chip" fill="#22d3ee" text-anchor="middle" data-maxw="151">Injection defense</text><text x="40" y="386" class="foot" data-maxw="920">Evaluated on the public SecAlertBench dataset: 8,322 real alerts from 3 enterprise SOCs, time split</text>
</svg>
