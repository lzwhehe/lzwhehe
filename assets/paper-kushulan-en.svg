<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".13"/><stop offset=".6" stop-color="#34d399" stop-opacity="0"/></linearGradient></defs><rect width="600" height="300" rx="16" fill="#111827"/><rect width="600" height="300" rx="16" fill="url(#g)"/><rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#243042"/><rect x="0" y="24" width="5" height="54" rx="2.5" fill="#34d399"/><text x="32" y="46" class="k" fill="#34d399" data-maxw="399">AI × HERITAGE · CO-FIRST AUTHOR</text><circle cx="570" cy="41" r="5" fill="#34d399" class="dot"/><text x="556" y="46" class="st" fill="#34d399" text-anchor="end" data-maxw="220">UNDER REVIEW</text><text x="32" y="96" class="t" data-maxw="536">Ku Shulan Paper-cut Generation</text><text x="32" y="130" class="s" data-maxw="536">LoRA (rank 32) on the 20B Qwen-Image-Edit model</text><text x="32" y="196" class="big" fill="#34d399" data-maxw="250">0.97</text><text x="32" y="222" class="ml" data-maxw="262">line recall, 32 held-out</text><text x="32" y="245" class="ml" data-maxw="262">drawings (B-LoRA 0.57)</text><line x1="298" y1="160" x2="298" y2="250" stroke="#243042"/><text x="316" y="196" class="big" fill="#34d399" data-maxw="250">1st</text><text x="316" y="222" class="ml" data-maxw="262">on all 3 criteria in an</text><text x="316" y="245" class="ml" data-maxw="262">18-rater blind evaluation</text><line x1="32" y1="262" x2="568" y2="262" stroke="#243042"/><text x="32" y="284" class="foot" data-maxw="536">257 images → 1,028 training pairs · submitted to npj Heritage Science</text>
