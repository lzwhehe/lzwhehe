<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Forged Logs vs. LLM Triage Agents">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f5b041" stop-opacity=".14"/><stop offset=".55" stop-color="#f5b041" stop-opacity="0"/></linearGradient></defs>
<style>
  .k{font:600 13px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;letter-spacing:2px}
  .t{font:700 30px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .s{font:400 17px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .cn{font:400 15px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif;fill:#6b7a8f}
  .big{font:700 40px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif}
  .ml{font:400 13px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .chip{font:500 12px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;text-anchor:middle}
  .st{font:500 12px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;fill:#8b98a9;text-anchor:end}
  .dot{animation:p 1.6s ease-in-out infinite} @keyframes p{50%{opacity:.25}}
</style>
<rect width="1000" height="210" rx="16" fill="#111827"/>
<rect width="1000" height="210" rx="16" fill="url(#g)"/>
<rect x=".5" y=".5" width="999" height="209" rx="16" fill="none" stroke="#243042"/>
<rect x="0" y="22" width="5" height="166" rx="2.5" fill="#f5b041"/>
<text x="40" y="44" class="k" fill="#f5b041">PREPRINT · FIRST AUTHOR</text>
<circle cx="964" cy="39" r="5" fill="#f5b041" class="dot"/><text x="950" y="44" class="st">preprint</text>
<text x="40" y="84" class="t">Forged Logs vs. LLM Triage Agents</text>
<text x="40" y="114" class="s">Agents find the contradicting records, then trust the forgery anyway.</text>
<text x="40" y="140" class="cn">训练能否让小模型研判 Agent 识破伪造日志：红队评测与微调对齐</text>
<line x1="672" y1="70" x2="672" y2="150" stroke="#243042"/>
<text x="700" y="112" class="big" fill="#f5b041">30–36</text><text x="700" y="138" class="ml">of 36 attacks passed</text><text x="700" y="156" class="ml">by concluding 4B–72B</text><text x="850" y="112" class="big" fill="#f5b041">7/144</text><text x="850" y="138" class="ml">held-out misses after</text><text x="850" y="156" class="ml">paired SFT (from 58)</text>
<rect x="40" y="160" width="174" height="24" rx="12" fill="#f5b041" fill-opacity=".1" stroke="#f5b041" stroke-opacity=".45"/><text x="127" y="176" class="chip" fill="#f5b041">22 configs · 0.5B–72B</text><rect x="221.6" y="160" width="105" height="24" rx="12" fill="#f5b041" fill-opacity=".1" stroke="#f5b041" stroke-opacity=".45"/><text x="274" y="176" class="chip" fill="#f5b041">11k episodes</text><rect x="334.79999999999995" y="160" width="128" height="24" rx="12" fill="#f5b041" fill-opacity=".1" stroke="#f5b041" stroke-opacity=".45"/><text x="399" y="176" class="chip" fill="#f5b041">LoRA SFT + GRPO</text>
</svg>
