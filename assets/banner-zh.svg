<text x="64" y="252" class="edu" data-maxw="816">JAIST 计算机硕士 · 网络安全实验室 · 2027 届 · 专业前 10%</text>
<text x="64" y="284" class="stack" data-maxw="816">LangGraph · MCP · RAG · vLLM · SFT / LoRA / GRPO · Python</text>
