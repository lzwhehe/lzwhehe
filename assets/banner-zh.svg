<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 312" width="1200" height="312" role="img" aria-label="刘卓文 — AI 安全工程师 · 大模型与 Agent 安全">
<style>
  .name{font:700 56px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:url(#nm);letter-spacing:2px}
  .alt{font:600 24px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#f5b041;letter-spacing:3px}
  .role{font:600 25px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#22d3ee}
  .pl{font:600 15px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif}
  .edu{font:500 17px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .stack{font:500 14px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;fill:#8b98a9}
  .rt{font:500 12px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;fill:#4b6a7f;letter-spacing:1px}
  .chip{font:500 13px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
  .ring{fill:none;stroke:#1e3a4a;stroke-width:1.2}
  .sweep{transform-origin:1040px 146px;animation:spin 4s linear infinite}
  .blip{opacity:0;animation:blip 4s ease-out infinite}
  .ping{opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 4s ease-out infinite}
  .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blip{0%{opacity:0}6%{opacity:1}60%{opacity:.15}100%{opacity:0}}
  @keyframes ping{0%{opacity:.9;transform:scale(1)}40%{opacity:0;transform:scale(4)}100%{opacity:0}}
  @keyframes blink{50%{opacity:0}}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#101b2d"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#18233a" stroke-width="1"/></pattern>
  <radialGradient id="glow" cx="1040" cy="146" r="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".55"/></linearGradient>
  <linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fe8f3"/></linearGradient>
</defs>
<rect width="1200" height="312" rx="18" fill="url(#bg)"/>
<rect width="1200" height="312" rx="18" fill="url(#grid)" opacity=".7"/>
<rect x=".5" y=".5" width="1199" height="311" rx="18" fill="none" stroke="#243042"/>
<text x="64" y="92" class="name" data-maxw="816">刘卓文</text>
<text x="254" y="90" class="alt" data-maxw="626">Liu Zhuowen</text>
<text x="64" y="138" class="role" data-maxw="816">&gt; AI 安全工程师 · 大模型与 Agent 安全<tspan class="cursor" fill="#22d3ee">▍</tspan></text>
