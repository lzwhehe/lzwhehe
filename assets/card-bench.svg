<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Passing the Test You Trained On">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".14"/><stop offset=".55" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>
<style>
  .k{font:600 13px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;letter-spacing:2px}
  .t{font:700 30px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .s{font:400 17px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .cn{font:400 15px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif;fill:#6b7a8f}
  .big{font:700 40px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif}
  .ml{font:400 13px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .chip{font:500 12px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;text-anchor:middle}
  .st{font:500 12px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;fill:#8b98a9;text-anchor:end}
  .dot{animation:p 1.6s ease-in-out infinite} @keyframes p{50%{opacity:.25}}
</style>
<rect width="1000" height="210" rx="16" fill="#111827"/>
<rect width="1000" height="210" rx="16" fill="url(#g)"/>
<rect x=".5" y=".5" width="999" height="209" rx="16" fill="none" stroke="#243042"/>
<rect x="0" y="22" width="5" height="166" rx="2.5" fill="#a78bfa"/>
<text x="40" y="44" class="k" fill="#a78bfa">PAPER DRAFT</text>
<circle cx="964" cy="39" r="5" fill="#a78bfa" class="dot"/><text x="950" y="44" class="st">draft</text>
<text x="40" y="84" class="t">Passing the Test You Trained On</text>
<text x="40" y="114" class="s">Do prompt-injection detector scores survive inside real agents?</text>
<text x="40" y="140" class="cn">提示词注入检测器在智能体工具输出上的再评测</text>
<line x1="672" y1="70" x2="672" y2="150" stroke="#243042"/>
<text x="700" y="112" class="big" fill="#a78bfa">15</text><text x="700" y="138" class="ml">detectors + 2 judges</text><text x="700" y="156" class="ml">on 3 benchmarks</text><text x="850" y="112" class="big" fill="#a78bfa">τ 0.01</text><text x="850" y="138" class="ml">rank transfer,</text><text x="850" y="156" class="ml">BIPIA → AgentDojo</text>
<rect x="40" y="160" width="82" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="81" y="176" class="chip" fill="#a78bfa">AgentDojo</text><rect x="130.39999999999998" y="160" width="67" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="164" y="176" class="chip" fill="#a78bfa">τ-bench</text><rect x="205.59999999999997" y="160" width="52" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45"/><text x="232" y="176" class="chip" fill="#a78bfa">BIPIA</text>
