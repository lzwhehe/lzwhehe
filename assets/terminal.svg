<style>
  .ln{font:400 17px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;white-space:pre}
  .ttl{font:500 14px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;fill:#8b98a9}
  @keyframes l0{0%,4%{opacity:0;transform:translateX(-6px)}7%,92%{opacity:1;transform:none}100%{opacity:0}}.l0{animation:l0 14.0s infinite}@keyframes l1{0%,13%{opacity:0;transform:translateX(-6px)}16%,92%{opacity:1;transform:none}100%{opacity:0}}.l1{animation:l1 14.0s infinite}@keyframes l2{0%,22%{opacity:0;transform:translateX(-6px)}25%,92%{opacity:1;transform:none}100%{opacity:0}}.l2{animation:l2 14.0s infinite}@keyframes l3{0%,31%{opacity:0;transform:translateX(-6px)}34%,92%{opacity:1;transform:none}100%{opacity:0}}.l3{animation:l3 14.0s infinite}@keyframes l4{0%,40%{opacity:0;transform:translateX(-6px)}43%,92%{opacity:1;transform:none}100%{opacity:0}}.l4{animation:l4 14.0s infinite}@keyframes l5{0%,49%{opacity:0;transform:translateX(-6px)}52%,92%{opacity:1;transform:none}100%{opacity:0}}.l5{animation:l5 14.0s infinite}@keyframes l6{0%,58%{opacity:0;transform:translateX(-6px)}61%,92%{opacity:1;transform:none}100%{opacity:0}}.l6{animation:l6 14.0s infinite}@keyframes l7{0%,67%{opacity:0;transform:translateX(-6px)}70%,92%{opacity:1;transform:none}100%{opacity:0}}.l7{animation:l7 14.0s infinite}
</style>
