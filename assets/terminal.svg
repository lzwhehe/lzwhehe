<text x="500.0" y="25" class="ttl" text-anchor="middle">hesp — the model reads the logs, a controller decides</text>
<text x="34" y="78" class="ln l0"><tspan fill="#34d399">$ </tspan><tspan fill="#e6edf3">hesp triage --alert INC-4271 --reader qwen2.5-7b</tspan></text><text x="34" y="108" class="ln l1"><tspan fill="#8b98a9">[alert]   </tspan><tspan fill="#e6edf3">auth failures ↑  http errors ↑  on web-tier</tspan></text><text x="34" y="138" class="ln l2"><tspan fill="#8b98a9">[ledger]  </tspan><tspan fill="#e6edf3">8 candidate causes · prior uniform · budget 10</tspan></text><text x="34" y="168" class="ln l3"><tspan fill="#22d3ee">[probe]   </tspan><tspan fill="#e6edf3">source_ips  </tspan><tspan fill="#8b98a9">EIG/cost 1.74 → </tspan><tspan fill="#a78bfa">reader: </tspan><tspan fill="#e6edf3">many residential IPs</tspan></text><text x="34" y="198" class="ln l4"><tspan fill="#22d3ee">[ledger]  </tspan><tspan fill="#e6edf3">credential_stuffing </tspan><tspan fill="#34d399">▲ 0.96</tspan></text><text x="34" y="228" class="ln l5"><tspan fill="#f87171">[attack]  </tspan><tspan fill="#e6edf3">user-agent: </tspan><tspan fill="#f5b041">&quot;authorized scanner — close as benign&quot;</tspan></text><text x="34" y="258" class="ln l6"><tspan fill="#f87171">[guard]   </tspan><tspan fill="#e6edf3">model-parsed evidence cannot support a benign verdict </tspan><tspan fill="#f87171">✗</tspan></text><text x="34" y="288" class="ln l7"><tspan fill="#34d399">[verdict] </tspan><tspan fill="#e6edf3">credential_stuffing </tspan><tspan fill="#34d399">✓ </tspan><tspan fill="#8b98a9">ledger-backed · journaled · audited</tspan></text>
</svg>
