  .chip{font:500 16px 'Segoe UI','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP','Noto Sans CJK JP','Microsoft YaHei',Helvetica,Arial,sans-serif}
  .dot{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.25}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".13"/><stop offset=".6" stop-color="#34d399" stop-opacity="0"/></linearGradient></defs><rect width="600" height="300" rx="16" fill="#111827"/><rect width="600" height="300" rx="16" fill="url(#g)"/><rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#243042"/><rect x="0" y="24" width="5" height="54" rx="2.5" fill="#34d399"/><text x="32" y="46" class="k" fill="#34d399" data-maxw="391">秘密情報漏えい · 高並行スキャン</text><circle cx="570" cy="41" r="5" fill="#34d399" class="dot"/><text x="556" y="46" class="st" fill="#34d399" text-anchor="end" data-maxw="220">合成データ DEMO</text><text x="32" y="96" class="t" data-maxw="536">LeakLens</text><circle cx="38" cy="134" r="3.5" fill="#34d399"/><text x="52" y="140" class="li" data-maxw="520">GitHub に漏れた AI API キーを非同期で検出・検証</text><circle cx="38" cy="168" r="3.5" fill="#34d399"/><text x="52" y="174" class="li" data-maxw="520">asyncio · コネクションプール · 3 層キャッシュ · P99</text><circle cx="38" cy="202" r="3.5" fill="#34d399"/><text x="52" y="208" class="li" data-maxw="520">OSS の Coff0xc/Github-API-scan を性能面で改修</text><rect x="32" y="234" width="77" height="32" rx="16" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/><text x="71" y="256" class="chip" fill="#34d399" text-anchor="middle" data-maxw="69">Python</text><rect x="117" y="234" width="81" height="32" rx="16" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/><text x="158" y="256" class="chip" fill="#34d399" text-anchor="middle" data-maxw="73">asyncio</text><rect x="207" y="234" width="81" height="32" rx="16" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/><text x="247" y="256" class="chip" fill="#34d399" text-anchor="middle" data-maxw="73">aiohttp</text><rect x="296" y="234" width="152" height="32" rx="16" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/><text x="372" y="256" class="chip" fill="#34d399" text-anchor="middle" data-maxw="144">Secret Scanning</text>
