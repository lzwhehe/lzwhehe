<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="伪造日志 vs. 研判 Agent">
<style>
  .k{font:600 15px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;letter-spacing:1.5px}
  .st{font:600 13px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace;letter-spacing:1px}
  .t{font:700 30px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#e6edf3}
  .s{font:400 19px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .li{font:400 19px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#c3cdd9}
  .big{font:700 36px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif}
  .ml{font:400 17px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#8b98a9}
  .foot{font:400 15px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif;fill:#8593a6}
  .chip{font:500 16px 'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',Helvetica,Arial,sans-serif}
  .dot{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.25}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#f87171" stop-opacity=".13"/><stop offset=".6" stop-color="#f87171" stop-opacity="0"/></linearGradient></defs><rect width="600" height="300" rx="16" fill="#111827"/><rect width="600" height="300" rx="16" fill="url(#g)"/><rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#243042"/><rect x="0" y="24" width="5" height="54" rx="2.5" fill="#f87171"/><text x="32" y="46" class="k" fill="#f87171" data-maxw="457">③ 红队 + 对齐 · 第一作者</text><circle cx="570" cy="41" r="5" fill="#f87171" class="dot"/><text x="556" y="46" class="st" fill="#f87171" text-anchor="end" data-maxw="220">预印本</text><text x="32" y="96" class="t" data-maxw="536">伪造日志 vs. 研判 Agent</text><text x="32" y="130" class="s" data-maxw="536">模型多半已查到矛盾的真实记录，却仍采信伪造日志</text><text x="32" y="196" class="big" fill="#f87171" data-maxw="250">30–36</text><text x="32" y="222" class="ml" data-maxw="262">能结案的 4B–72B 模型</text><text x="32" y="245" class="ml" data-maxw="262">放行的攻击数（共 36）</text><line x1="298" y1="160" x2="298" y2="250" stroke="#243042"/><text x="316" y="196" class="big" fill="#f87171" data-maxw="250">58→7</text><text x="316" y="222" class="ml" data-maxw="262">LoRA SFT + GRPO 后</text><text x="316" y="245" class="ml" data-maxw="262">留出集漏报（共 144）</text><line x1="32" y1="262" x2="568" y2="262" stroke="#243042"/><text x="32" y="284" class="foot" data-maxw="536">22 个配置（Qwen2.5/Qwen3/Llama-3.1，0.5B–72B）· 1.1 万回合 · 补充实验中</text>
</svg>
