<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".13"/><stop offset=".6" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><rect width="600" height="300" rx="16" fill="#111827"/><rect width="600" height="300" rx="16" fill="url(#g)"/><rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#243042"/><rect x="0" y="24" width="5" height="54" rx="2.5" fill="#a78bfa"/><text x="32" y="46" class="k" fill="#a78bfa" data-maxw="457">① 评测 · 独立作者</text><circle cx="570" cy="41" r="5" fill="#a78bfa" class="dot"/><text x="556" y="46" class="st" fill="#a78bfa" text-anchor="end" data-maxw="220">预印本</text><text x="32" y="96" class="t" data-maxw="536">Passing the Test You Trained On</text><text x="32" y="130" class="s" data-maxw="536">提示注入检测器放进真实 Agent 还管用吗？</text><text x="32" y="196" class="big" fill="#a78bfa" data-maxw="250">~2%</text><text x="32" y="222" class="ml" data-maxw="262">BIPIA 榜首在 1% 误报率下</text><text x="32" y="245" class="ml" data-maxw="262">对 AgentDojo 注入的检出</text><line x1="298" y1="160" x2="298" y2="250" stroke="#243042"/><text x="316" y="196" class="big" fill="#a78bfa" data-maxw="250">0–90%+</text><text x="316" y="222" class="ml" data-maxw="262">各检测器在工具输出上的</text><text x="316" y="245" class="ml" data-maxw="262">误报率区间</text><line x1="32" y1="262" x2="568" y2="262" stroke="#243042"/><text x="32" y="284" class="foot" data-maxw="536">15 个检测器（含 Prompt Guard 2）+ 2 个 LLM 裁判 · 训练集混入 1,116 条 BIPIA</text>
